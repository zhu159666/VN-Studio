name: Build Windows installer

# 最终用户从 GitHub Releases 下载安装包；源码仓库本身不包含 exe/依赖。
# 触发方式：
#   1) 推送 v* 标签 → 自动构建并发布到 Releases；
#   2) 手动运行（Actions → Build Windows installer → Run workflow）→ 构建并保留为 Artifacts。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 音频导入测试（wav → ogg）需要 ffmpeg，因此先安装并放入 PATH。
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      # 把真正的静态二进制复制到 editor/build（prepare-ffmpeg.mjs 会直接复用）。
      - name: Stage bundled ffmpeg
        run: |
          New-Item -ItemType Directory -Force editor/build | Out-Null
          $real = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 20MB } | Select-Object -First 1
          if (-not $real) { throw '未在 Chocolatey 包中找到 ffmpeg.exe' }
          Copy-Item $real.FullName editor/build/ffmpeg.exe -Force
          & editor/build/ffmpeg.exe -version | Select-Object -First 1

      # phase7 打包测试要求 editor/dist/index.html 存在。
      - name: Build renderer
        run: pnpm editor:build

      - name: Run tests
        run: node --test "tests/**/*.test.mjs"

      - name: Check schema and docs
        run: |
          pnpm check:schema
          pnpm check:docs

      - name: Build app and standard NSIS installer
        run: pnpm editor:dist:win

      - name: Build full installer (embedded ffmpeg, makensis)
        run: node scripts/build-installer.mjs --skip-prepare

      - name: Show artifacts
        run: |
          Get-ChildItem editor/release/*.exe | Select-Object Name, Length
          Get-Content editor/release/INSTALLER-INFO.json

      - name: Upload installers (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: vn-studio-windows
          if-no-files-found: error
          path: |
            editor/release/VN-Studio-Setup-*.exe
            editor/release/INSTALLER-INFO.json

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            editor/release/VN-Studio-Setup-*.exe
            editor/release/INSTALLER-INFO.json
